<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>最后一班地铁：0017 · 角色互动版</title>
<style>
 :root{
   --bg:#0b131b;--panel:#15212c;--panel2:#1d2b37;--line:#2a3a48;
   --green:#48d6a4;--amber:#f5b54a;--red:#e8654f;--blue:#6fb3ff;--violet:#b08cff;
   --txt:#eef3f7;--muted:#9cb0c0;--dim:#6c7c8c;
 }
 *{box-sizing:border-box}
 html,body{height:100%;margin:0}
 body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei","微软雅黑",system-ui,sans-serif;overflow:hidden}
 #app{height:100vh;display:flex;flex-direction:column}
 header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:#101922;flex:0 0 auto}
 .brand{font-size:18px;font-weight:800;letter-spacing:1px}
 .brand span{color:var(--green)}
 .stat{font-size:13px;color:var(--muted)}
 .stat b{color:var(--txt);font-size:18px;font-variant-numeric:tabular-nums}
 #clock{color:var(--amber)}
 .spacer{flex:1}
 button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);
        color:var(--txt);border-radius:8px;padding:7px 13px;font-size:13px;transition:.15s}
 button:hover:not(:disabled){border-color:var(--green);background:#1b2a36}
 button:disabled{opacity:.35;cursor:not-allowed}
 main{flex:1;display:grid;grid-template-columns:1fr 318px;grid-template-rows:1fr auto;gap:12px;padding:12px 18px 16px;min-height:0}
 /* ---------- stage ---------- */
 .scene{position:relative;grid-column:1;grid-row:1;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#070d13}
 .env{position:absolute;inset:0;width:100%;height:100%;display:block}
 .zonelabel{position:absolute;top:138px;transform:translateX(-50%);font-size:11px;color:#a9c0d0;
            background:rgba(9,17,24,.74);border:1px solid #24404f;border-radius:6px;padding:2px 9px;white-space:nowrap}
 .relaybox{position:absolute;left:14px;top:196px;display:flex;gap:7px;align-items:center;font-size:11px;color:var(--muted);
           background:rgba(9,17,24,.72);border:1px solid #24404f;border-radius:7px;padding:4px 9px}
 .dot{width:11px;height:11px;border-radius:50%;background:#33424f;transition:.3s}
 .dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}
 .dot.bad{background:var(--red);box-shadow:0 0 10px var(--red)}
 /* console object */
 #console{position:absolute;left:6%;bottom:96px;width:80px;height:56px;border:1px solid #35506a;border-radius:8px;
          background:linear-gradient(180deg,#1b2c3c,#13202b);cursor:pointer;transition:.2s;z-index:6}
 #console:hover{border-color:var(--blue);box-shadow:0 0 14px rgba(111,179,255,.35)}
 #console .screen{position:absolute;left:8px;right:8px;top:8px;height:22px;border-radius:4px;background:#0d1b26;border:1px solid #2b465c;
                  color:var(--blue);font-size:10px;display:flex;align-items:center;justify-content:center}
 #console .tag{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:10px;color:var(--dim)}
 /* characters */
 .char{position:absolute;bottom:96px;width:88px;height:150px;transform-origin:50% 100%;
       transition:left .95s cubic-bezier(.45,.05,.55,.95);cursor:pointer;z-index:8}
 .char:hover .fig{filter:drop-shadow(0 0 8px rgba(72,214,164,.55))}
 .fig{width:100%;height:100%;overflow:visible}
 .fig .body{transform-origin:50% 100%;animation:bob 2.8s ease-in-out infinite}
 .fig .armL{transform-origin:15px 40px}
 .fig .armR{transform-origin:44px 40px}
 .fig .legL{transform-origin:26px 62px}
 .fig .legR{transform-origin:34px 62px}
 .fig .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
 .char.walk .fig .body{animation:none}
 .char.walk .fig .legL{animation:legA .42s ease-in-out infinite}
 .char.walk .fig .legR{animation:legB .42s ease-in-out infinite}
 .char.walk .fig .armL{animation:armA .42s ease-in-out infinite}
 .char.walk .fig .armR{animation:armB .42s ease-in-out infinite}
 .char.talk .fig .body{animation:talk 1.2s ease-in-out infinite}
 .char .name{position:absolute;left:50%;transform:translateX(-50%);bottom:-2px;font-size:11px;color:var(--muted);
             background:rgba(10,18,25,.75);padding:1px 7px;border-radius:8px;white-space:nowrap}
 .char.talk .name{color:var(--green);border:1px solid var(--green)}
 .bubble{--bg:#eef3f7;position:absolute;max-width:300px;padding:9px 14px 11px;border-radius:14px;
         border:1px solid transparent;background:var(--bg);color:#16222e;font-size:13.5px;line-height:1.45;
         z-index:30;opacity:0;transition:opacity .18s;pointer-events:none;transform:translateX(-50%);
         box-shadow:0 10px 26px rgba(0,0,0,.45);word-break:break-word}
 .bubble.show{opacity:1}
 .bubble .who{display:block;font-size:11px;margin-bottom:3px;opacity:.7}
 .bubble .txt{display:block}
 .bubble .more{position:absolute;right:11px;bottom:4px;font-size:10px;font-style:normal;opacity:.55;animation:arw 1.1s infinite}
 .bubble:after{content:"";position:absolute;left:calc(50% + var(--tail,0px));bottom:-8px;margin-left:-8px;
               border:8px solid transparent;border-top-color:var(--bg)}
 .bub-lin{--bg:#dbe9fb;border-color:#6fb3ff;color:#152232}
 .bub-zhou{--bg:#fdeed2;border-color:#f5b54a;color:#2a2013}
 .bub-chen{--bg:#d8f4e7;border-color:#48d6a4;color:#12261e}
 .bub-con{--bg:#e6eef5;border-color:#93a7b6;color:#16222e}
 .bub-narr{--bg:#f1f5f8;border-color:#c3d2de;color:#16222e}
 @keyframes arw{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
 /* ---------- dialogue ---------- */
 .dialogue{grid-column:1;grid-row:2;border:1px solid var(--line);border-radius:14px;background:var(--panel);
           padding:10px 16px;min-height:96px;display:flex;flex-direction:column;gap:8px;justify-content:center}
 .dhint{font-size:12.5px;color:var(--dim)}
 .opts{display:flex;flex-wrap:wrap;gap:8px}
 .opts button{font-size:13px;padding:8px 14px}
 .opts button.p{background:#16302a;border-color:#2f6f57}
 /* ---------- side ---------- */
 .side{grid-column:2;grid-row:1/span 2;border:1px solid var(--line);border-radius:14px;background:var(--panel);
       padding:12px 13px;overflow:auto;min-height:0}
 .side h3{margin:0 0 8px;font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
 .clue{border:1px solid var(--line);border-radius:9px;padding:6px 9px;margin-bottom:6px;background:var(--panel2);
       font-size:12px;color:var(--dim);line-height:1.35}
 .clue.un{border-color:var(--green);color:var(--txt);background:#152a22}
 .clue b{color:var(--green)}
 #log{margin-top:8px;border-top:1px solid var(--line);padding-top:7px;font-size:12px;color:var(--muted);max-height:210px;overflow:auto}
 #log div{margin-bottom:4px;line-height:1.35}
 #log .hl{color:var(--amber)}
 #log .bad{color:var(--red)}
 .modal{position:fixed;inset:0;background:rgba(6,10,14,.88);display:flex;align-items:center;justify-content:center;z-index:60}
 .modal.hidden{display:none}
 .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:640px;padding:28px 32px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
 .card h2{margin:0 0 6px;font-size:25px}
 .card .tag{font-size:12px;letter-spacing:2px;color:var(--green);margin-bottom:12px}
 .card p{line-height:1.7;color:var(--muted);margin:7px 0}
 .card p.q{color:var(--txt)}
 .char.player{transition:none;z-index:11}
 .char.player .name{color:var(--amber);border:1px solid var(--amber)}
 #prompt{position:absolute;transform:translateX(-50%);background:var(--amber);color:#16222e;
         font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;z-index:26;
         opacity:0;transition:.15s;pointer-events:none;white-space:nowrap}
 #prompt.show{opacity:1}
 .keyhint{font-size:11.5px;color:var(--dim)}
 .timebar{width:210px;height:7px;border-radius:4px;background:#223240;overflow:hidden;
          border:1px solid #2a3a48;flex:0 0 auto}
 .timebar i{display:block;height:100%;width:100%;background:var(--green);transition:width .35s linear,background .35s}
 @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
 @keyframes legA{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
 @keyframes legB{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
 @keyframes armA{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
 @keyframes armB{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}}
 @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
 @keyframes talk{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(-1.2deg)}}
</style>

const keys={};

function reset(){
  S={loop:1,minute:0,points:PTS,clues:new Set(),relay:false,broadcast:"normal",
     trainPos:"三道",chen:false,paused:true,speed:1,over:false,acc:0,
     talking:null,queue:null,after:null,mode:null};
  CHARS.forEach(c=>{c.x=c.home;c.zone="wait";});
}
function fmt(m){let t=23*60+50+m,h=Math.floor(t/60)%24,mm=t%60;return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0");}
function log(msg,cls){const d=document.createElement("div");if(cls)d.className=cls;d.textContent="["+fmt(S.minute)+"] "+msg;
  const b=document.getElementById("log");b.appendChild(d);b.scrollTop=b.scrollHeight;}
function addClue(id){if(S.clues.has(id))return;S.clues.add(id);log("解锁线索 "+id+" · "+CLUES[id].n,"hl");}
function build(){
  const sc=document.getElementById("scene");
  document.querySelectorAll(".char").forEach(e=>e.remove());
  CHARS.forEach(c=>{
    const d=document.createElement("div");
    d.className="char"; d.id="char-"+c.id; d.style.left=c.x+"%";
    d.innerHTML=svgFor(c)+'<div class="name">'+c.name+'</div>';
    d.onclick=()=>talk(c.id);
    sc.appendChild(d); els[c.id]=d;
  });
  const pl=document.createElement("div");
  pl.className="char player"; pl.id="char-player";
  pl.innerHTML=svgPlayer()+'<div class="name">你 · 调度员</div>';
  pl.style.bottom="96px"; sc.appendChild(pl); els.player=pl;
  els.prompt=document.getElementById("prompt");
  els.bubble=document.getElementById("bubble");
  document.getElementById("console").onclick=()=>talk("console");
  document.getElementById("dialogue").onclick=(e)=>{ if(e.target.tagName!=="BUTTON") advance(); };
}
function move(c,toX,zone){
  c.x=toX; c.zone=zone;
  const d=els[c.id]; d.classList.add("walk"); d.style.left=toX+"%";
  setTimeout(()=>d.classList.remove("walk"),1000);
}
function say(id,text,ms){
  showBubble(id,text,false);
  clearTimeout(els.bubble._t);
  els.bubble._t=setTimeout(()=>{ if(S.mode!=="lines") hideBubble(); },ms||3600);
}
function targets(){
  const t=CHARS.map(c=>({id:c.id,x:c.x,name:c.name}));
  t.push({id:"console",x:6,name:"控制台"});
  return t;
}
function nearest(){
  let best=null,bd=8.5;
  targets().forEach(t=>{const d=Math.abs(t.x-PLAYER.x); if(d<bd){bd=d;best=t;}});
  return best;
}
function updatePlayer(dt){
  let dx=0,dy=0;
  if(keys.left) dx-=1; if(keys.right) dx+=1;
  if(keys.up) dy+=1; if(keys.down) dy-=1;
  const moving=dx!==0||dy!==0;
  if(moving){
    PLAYER.x=clamp(PLAYER.x+dx*PLAYER.speed*dt,2,95);
    PLAYER.y=clamp(PLAYER.y+dy*PLAYER.speed*0.9*dt,96,182);
    if(dx!==0) PLAYER.dir=dx>0?1:-1;
    els.player.classList.add("walk");
  } else els.player.classList.remove("walk");
  els.player.style.left=PLAYER.x+"%";
  els.player.style.bottom=PLAYER.y+"px";
  els.player.querySelector(".fig").style.transform = PLAYER.dir<0?"scaleX(-1)":"";
  const n=nearest(), pr=els.prompt;
  if(n && !S.over && S.mode!=="lines"){
    pr.textContent = (n.id==="console" ? "按 F 调度列车" : "按 F 和"+n.name+"说话");
    pr.style.left=n.x+"%"; pr.style.bottom="258px"; pr.classList.add("show");
  } else pr.classList.remove("show");
}
function render(){
  document.getElementById("clock").textContent=fmt(S.minute);
  document.getElementById("loop").textContent=S.loop+" / 4";
  document.getElementById("points").textContent=S.points;
  document.getElementById("btnPlay").textContent=S.paused?"继续":"暂停";
  document.getElementById("btnSpeed").textContent=S.speed+"×";
  const remain=Math.max(0,1-S.minute/27);
  const tb=document.getElementById("timebar");
  tb.style.width=(remain*100)+"%";
  tb.style.background = remain>0.5?"var(--green)":(remain>0.25?"var(--amber)":"var(--red)");
  document.getElementById("relayDot").className="dot "+(S.relay?"on":(S.minute>=12?"bad":""));
  document.getElementById("consoleScreen").textContent = S.trainPos==="二道"?"二道停稳":(S.trainPos==="环线"?"检修环线":"进二道");
  const cb=document.getElementById("clues"); cb.innerHTML="";
  Object.keys(CLUES).forEach(k=>{
    const on=S.clues.has(k);
    const d=document.createElement("div"); d.className="clue"+(on?" un":"");
    d.innerHTML="<b>"+k+"</b> "+(on?CLUES[k].n:"？？？")+"<br>"+(on?CLUES[k].t:"尚未解锁");
    cb.appendChild(d);
  });
  CHARS.forEach(c=>{ if(els[c.id]) els[c.id].style.left=c.x+"%"; });
  if(S.mode) refreshOpts();
}
/* ---------- dialogue ---------- */
function bubClass(id){
  if(id==="lin") return "bub-lin";
  if(id==="zhou") return "bub-zhou";
  if(id==="chen") return "bub-chen";
  if(id==="console") return "bub-con";
  return "bub-narr";
}
function whoName(id){
  if(id==="console") return "调度控制台";
  const c=CHARS.find(x=>x.id===id);
  return c?c.name:"旁白";
}
function showBubble(id,text,more){
  const b=els.bubble, sc=document.getElementById("scene");
  const c=CHARS.find(x=>x.id===id);
  const base = c ? c.x : 50;
  b.className="bubble "+bubClass(id)+" show";
  b.innerHTML='<b class="who"></b><span class="txt"></span>'+(more?'<i class="more">▼</i>':'');
  b.querySelector(".who").textContent=whoName(id);
  b.querySelector(".txt").textContent=text;
  b.style.bottom=(c?272:250)+"px";
  b.style.left=base+"%";
  const sw=Math.max(sc.clientWidth,1);
  const bw=b.offsetWidth;
  const half=(bw/sw)*50;
  const lx=Math.max(half+1.5, Math.min(98.5-half, base));
  b.style.left=lx+"%";
  const charPx=(base/100)*sw, bubPx=(lx/100)*sw;
  b.style.setProperty("--tail",(charPx-bubPx)+"px");
}
function hideBubble(){ els.bubble.classList.remove("show"); }
function linesFor(id){
  const r=S.loop, has=k=>S.clues.has(k);
  if(id==="lin"){
    if(S.relay) return ["五号继电器已经隔离。旧命令不会再来一次了。"];
    if(r===1&&!has("C01")) return [
      "我是信号检修，不是乘客。五号继电器的反馈慢了半秒。",
      "让我进控制室。这个端口十七年前就封了，我的工牌能打开它。"];
    if(!has("C02")) return [
      "继电器日志被覆盖过，但机械触点不会撒谎。",
      "十七年前和现在，都是同一只手指按下去的。让我比对两次进路。"];
    return ["我父亲当年被写成闯红灯的人。我要知道那句命令是谁发的。",
            "让我进信号室。不是为了证明他无辜，是为了让下一班车不再替旧记录死一次。"];
  }
  if(id==="zhou"){
    if(S.broadcast==="evac") return ["广播已经发出。站台上的人正在往东侧出口走。"];
    if(r===1&&!has("C03")) return [
      "别关站内广播。我在做一期节目，叫《谁弄丢了 0017》。",
      "刚才那声不是电流，是有人在喊车次。让我听完整的。"];
    if(!has("C04")) return [
      "磁带倒过来不是杂音。有人说过三道有人、改四道，可官方报告写着三道无人。",
      "我承认，那期节目里我用了你父亲的名字。因为所有人都只会点击一个罪人，不会点击一份报告。"];
    return ["我会把警告说清楚，不用我姐姐的名字换点击量。",
            "让我上广播台，先把还活着的人送出站。"];
  }
  if(id==="chen"){
    if(S.trainPos==="环线") return ["列车在环线上，施工车进不了四道了。"];
    if(r===1&&!has("C05")) return [
      "这只包在失物柜里放了十七年。今天有人用我的名字把它取出来，我得送回去。",
      "一把旧钥匙而已。站里换了系统，这样的东西早就没用了。"];
    if(!has("C06")) return [
      "改四道需要停用钥匙和站长的口头命令。",
      "三道有人。不是车，是人。"];
    return ["我做了紧急处置，又怕承担后果。后来每一次掩盖，都比第一次改道更像犯罪。",
            "我签过假的记录。现在我来签真的。"];
  }
  if(id==="console") return ["0017 次正在接近岚桥站。","你可以让它进二道停稳，也可以保持自动进路。"];
  return [];
}
function playLines(id,lines,after){
  S.talking=id; S.queue=lines.slice(); S.after=after||null; S.mode="lines";
  CHARS.forEach(c=>els[c.id]&&els[c.id].classList.toggle("talk",c.id===id));
  nextLine();
}
function nextLine(){
  if(S.queue&&S.queue.length){
    const ln=S.queue.shift();
    showBubble(S.talking,ln,S.queue.length>0);
    refreshOpts();
    return;
  }
  const f=S.after; S.after=null;
  if(f){ f(); }
}
function advance(){ if(S.mode==="lines"){ nextLine(); return true; } return false; }
function talk(id){
  if(S.over) return;
  if(S.mode==="lines"){ nextLine(); return; }
  if(S.talking===id&&S.mode==="options") return;
  S.talking=id;
  playLines(id,linesFor(id),()=>{ S.mode="options"; refreshOpts(); render(); });
}
function refreshOpts(){
  const box=document.getElementById("opts"), hint=document.getElementById("dhint");
  if(!box) return;
  box.innerHTML="";
  if(S.mode==="lines"){ hint.textContent="按 F 或点这里继续"; const cb=addOptBtn(box,"继续 ▶",()=>nextLine(),false); cb.dataset.cont="1"; return; }
  if(S.mode==="options"&&S.talking){ hint.textContent="你的选择（空格 = 第一个，或按数字键）"; buildOptions(S.talking,box); return; }
  hint.textContent="走到乘客身边按 F 交谈 · 点击控制台调度列车";
}
function addOptBtn(box,label,fn,paid){
  const b=document.createElement("button");
  b.textContent=label;
  b.disabled = paid ? (S.points<1||S.over||S.paused) : false;
  if(!b.disabled) b.classList.add("p");
  b.onclick=()=>{ if(b.disabled) return; if(paid) S.points-=1; fn(); };
  box.appendChild(b);
  return b;
}
function buildOptions(id,box){
  const c=CHARS.find(x=>x.id===id);
  const act=fn=>()=>{ fn(); refreshOpts(); render(); };
  const A=(l,fn,lock)=>{ const b=addOptBtn(box,l,act(fn),true); if(lock) b.disabled=true; return b; };
  if(id==="lin"){
    if(!S.clues.has("C01")) A("允许她接入旧继电器端口（-1）",()=>{addClue("C01");say("lin","端口开了。给我三分钟。");});
    else if(!S.clues.has("C02")) A("让她比对两次进路（-1）",()=>{addClue("C02");say("lin","00:16:43，自动进路被人为解除。");});
    else if(!S.relay) A("安排她进信号室，隔离五号继电器（-1）",()=>{S.relay=true;move(c,18,"signal");say("lin","五号继电器已隔离，旧命令失去电源。",4200);log("林岚进入信号室，五号继电器被隔离。","hl");});
  }
  if(id==="zhou"){
    if(!S.clues.has("C03")) A("调取站内旧录音（-1）",()=>{addClue("C03");say("zhou","三道有人，改四道。官方报告却写着三道无人。",4400);});
    else if(!S.clues.has("C04")) A("读取未发布终稿（-1）",()=>{addClue("C04");say("zhou","有人提前写好了结论。",4200);});
    else if(S.broadcast!=="evac") A("让他主持公开疏散广播（-1）",()=>{S.broadcast="evac";move(c,61,"booth");say("zhou","请由东侧出口离站，不要奔跑，不要返回站台。这不是演练。",4800);log("周砚发出公开疏散广播。","hl");},S.clues.size<3);
  }
  if(id==="chen"){
    if(!S.clues.has("C05")) A("检查他的失物袋（-1）",()=>{addClue("C05");say("chen","一把旧钥匙而已。站里换了系统，这样的东西早就没用了。",4400);});
    else if(!S.clues.has("C06")) A("让他独自进入旧检修通道（-1）",()=>{addClue("C06");move(c,86,"tunnel");say("chen","那时候三道有人。我叫邵国安，他还在隧道里。",5000);log("陈默进入旧检修通道，找到巡检簿撕页。","hl");});
    else if(S.trainPos!=="环线") A("用停用钥匙把 0017 改入检修环线（-1）",()=>{S.trainPos="环线";say("chen","钥匙还能用。把车交给我。",4200);log("0017 被手动改入检修环线。");});
  }
  if(id==="console"){
    A("0017 进二道停稳（-1）",()=>{S.trainPos="二道";log("0017 次接到人工调度，减速进二道。");say("lin","列车在二道停稳了。",3600);},S.trainPos==="二道");
  }
}
/* ---------- sequences ---------- */
function sequence(tag,title,lines,done){
  S.paused=true; render();
  const card=document.getElementById("seqCard");
  card.innerHTML="<div class='tag'>"+tag+"</div><h2>"+title+"</h2>"+
    lines.map(t=>"<p class='q'>"+t+"</p>").join("")+
    "<div class='opts'><button class='p' id='seqBtn'>继续</button></div>";
  const box=document.getElementById("seq"); box.classList.remove("hidden");
  document.getElementById("seqBtn").onclick=()=>{
    box.classList.add("hidden"); S.paused=false; render();
    if(done) done();
  };
}
function beginRound(){
  S.minute=0; S.points=PTS; S.acc=0; S.relay=false; S.broadcast="normal";
  S.trainPos="三道"; S.chen=false; S.talking=null; S.queue=null; S.after=null; S.mode=null;
  CHARS.forEach(c=>{c.x=c.home;c.zone="wait"; if(els[c.id]) els[c.id].classList.remove("talk");});
  render();
  sequence("站内广播 · 第 "+S.loop+" 轮 / 共 4 轮","23:50",START_TEXT[S.loop]||[],null);
}
/* ---------- outcome ---------- */
function outcome(){
  const c=S.clues.size;
  if(S.relay&&S.trainPos==="二道"&&S.broadcast==="evac"&&c>=5) return "A";
  if(S.trainPos==="环线"&&c>=4) return "B";
  return null;
}
function showEnd(kind){
  S.over=true; S.paused=true; render();
  const card=document.getElementById("modalCard"); let h="";
  if(kind==="A"){
    h+="<div class='tag'>结局 A · 公开真相</div><h2>零点之后</h2>";

    h+="<p>广播：本次列车暂停服务，所有乘客请由东侧出口离站。今晚的延误不是故障，是一份迟到了十七年的记录。</p>";
    h+="<p>第二天，林远舟的名字从事故责任人一栏移出。周砚重录了那期节目，开头第一次没有配乐。陈默走进调查室时，把停用钥匙放在了桌上。</p>";
  } else if(kind==="B"){
    h+="<div class='tag'>结局 B · 封存真相</div><h2>最后一班</h2>";
    h+="<p class='q'>00:16:50，0017 被手动送进检修环线。空工程车驶入四道。00:17，旧命令执行完毕，线路恢复。</p>";
    h+="<p>广播：设备故障已排除，0017 次取消运行。请乘客改乘接驳车辆，感谢配合。</p>";
    h+="<p>没有人伤亡。公开通报没有出现任何人的名字。陈默把钥匙留在失物招领柜，周砚删掉了录音。林岚在清晨第一班车前重新校准五号继电器，像什么都没发生过。</p>";
  } else {
    h+="<div class='tag'>未达成</div><h2>真相没能被揭开</h2>";
    h+="<p class='q'>四次循环都用完了。0017 次消失在废弃四道。</p>";
    h+="<p>屏幕只留下一行灰字：列车位置未知。</p>";
    h+="<p>下次记得：先向三个人问出六条线索，再让林岚进信号室隔离五号继电器、周砚主持公开疏散广播，最后让 0017 停进二道。</p>";
  }
  h+="<div class='opts'><button class='p' onclick='hardReset()'>再来一次</button></div>";
  card.innerHTML=h; document.getElementById("modal").classList.remove("hidden");
}
function endRound(){
  const k=outcome();
  if(k){ showEnd(k); return; }
  if(S.loop>=4){ showEnd("X"); return; }
  const cur=S.loop;
  sequence("第 "+cur+" 轮结束","00:17",END_TEXT[cur]||[],()=>{ S.loop++; beginRound(); });
}
function hardReset(){
  document.getElementById("modal").classList.add("hidden");
  document.getElementById("seq").classList.add("hidden");
  document.getElementById("log").innerHTML="";
  hideBubble();
  reset(); render();
  log("23:50。岚桥站最后一班车即将进站。0017 次，进二道。","hl");
  beginRound();
}
let last=0;
function tick(ts){
  requestAnimationFrame(tick);
  if(!last) last=ts;
  const dt=(ts-last)/1000; last=ts;
  if(S.paused||S.over) return;
  updatePlayer(dt);
  S.acc+=dt*1000;
  if(S.acc>=4000/S.speed){ S.acc=0; S.minute++;
    if(S.minute>=27) endRound(); else render();
  }
}
const KMAP={ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right",
            ArrowUp:"up",w:"up",W:"up",ArrowDown:"down",s:"down",S:"down"};
document.addEventListener("keydown",e=>{
  const k=KMAP[e.key];
  if(k){ keys[k]=true; e.preventDefault(); return; }
  if(e.key==="f"||e.key==="F"){
    e.preventDefault();
    if(advance()) return;
    const n=nearest(); if(n&&!S.over) talk(n.id);
    return;
  }
  if(e.key===" "||e.key==="Spacebar"){
    e.preventDefault();
    const paid=[].slice.call(document.querySelectorAll("#opts button")).filter(b=>!b.disabled && !b.dataset.cont);
    if(paid.length) paid[0].click(); else advance();
    return;
  }
  if(e.key==="Escape"){
    S.talking=null; S.mode=null; S.queue=null; S.after=null;
    CHARS.forEach(c=>els[c.id]&&els[c.id].classList.remove("talk"));
    hideBubble(); refreshOpts();
    return;
  }
  if(e.key==="p"||e.key==="P"){ S.paused=!S.paused; render(); return; }
  if(e.key==="1"||e.key==="2"||e.key==="3"){
    const btns=[].slice.call(document.querySelectorAll("#opts button"));
    const b=btns[parseInt(e.key,10)-1];
    if(b&&!b.disabled) b.click();
  }
});
document.addEventListener("keyup",e=>{ const k=KMAP[e.key]; if(k) keys[k]=false; });
document.getElementById("btnPlay").onclick=()=>{S.paused=!S.paused;render();};
document.getElementById("btnSpeed").onclick=()=>{S.speed=S.speed===1?2:(S.speed===2?4:1);render();};
document.getElementById("btnReset").onclick=hardReset;
build(); reset(); render(); hardReset();
requestAnimationFrame(tick);
</script>
</body>
</html>
